<div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between text-white p-3" [ngClass]="{
         'bg-success': bookingStatus === 'Success' || bookingStatus === 'Today',
         'bg-primary': bookingStatus === 'Rescheduled',
         'bg-danger': bookingStatus === 'Cancelled',
         'bg-warning': bookingStatus === 'Completed'
       }">
        <h5 class="mb-0 p-2 text-dark">{{ bookingStatus }} Booking</h5>
        <button class="btn btn-light" routerLink="/booking/newbooking">Create New Booking</button>
    </div>

    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-hover text-center mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Booking ID</th>
                        <th>Vehicle Number</th>
                        <th>Owner Name</th>
                        <th>Service Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of bookings; track $index) {
                    <tr>
                        <td class="m-1">{{ $index + 1 }}</td>
                        <td>{{ item.registrationNumber }}</td>
                        <td class="m-1">{{ item.ownerName }}</td>
                        <td>{{ item.startTime |  date: 'dd/MM/yyyy, h:mm a' }}</td>
                        <td class="m-1">
                            <button class="btn btn-sm btn-outline-primary">Reschedule</button>
                            <button class="btn btn-sm btn-outline-danger ms-1">Cancel</button>
                            <button class="btn btn-sm btn-outline-success ms-1">Completed</button>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
