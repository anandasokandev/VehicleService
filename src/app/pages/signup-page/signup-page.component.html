<div class="main d-flex justify-content-center">
    <div class="card" style="max-width: 1000px; width: 100%;">
        <div class="card-header text-center bg-secondary">
            <h4>Signup - </h4>
        </div>
        <div class="card-body">
            <form>
                <div class="row">
                    <div class="col-12">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" id="firstName" class="form-control">
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <div class="col-lg-6">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" id="phone" class="form-control">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-lg-6">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" class="form-control">
                    </div>
                    <div class="col-lg-6">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-lg-6">
                        <label for="addresslane1" class="form-label">AddressLane 1</label>
                        <input type="text" id="addresslane1" class="form-control">
                    </div>
                    <div class="col-lg-6">
                        <label for="addresslane2" class="form-label">AddressLane 2</label>
                        <input type="text" id="addresslane2" class="form-control">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-lg-6">
                        <label for="location" class="form-label">Location</label>
                        <select id="location" class="form-select" aria-label="Location Select">
                            <option value="">Select Location</option>
                            <option value="">1</option>
                            <option value="">2</option>
                            <option value="">3</option>
                        </select>
                        <div class="mt-2">
                            <p>Can't find your location? <span class="fw-bold text-primary" (click)="openModal()">Add Location</span></p>
                            <app-location [show]="showModal" (close)="handleCloseModal()" ></app-location>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col d-flex justify-content-center">
                        <button class="btn btn-warning px-5">
                            Signup
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
