<div class="main d-flex justify-content-center">
    <div class="card" style="max-width: 1000px; width: 100%;">
        <div class="card-header text-center bg-warning p-3">
            <h4>Signup - {{ role }} </h4>
        </div>
        <div class="card-body">
            <form [formGroup]="form" (ngSubmit)="submit()">
                <!-- Full Name -->
                <div class="mb-3" *ngIf="role == 'User'">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" formControlName="fullName">
                    <div class="text-danger" *ngIf="form.get('fullName')?.touched && form.get('fullName')?.invalid">
                        Full Name is required.
                    </div>
                </div>

                <div class="mb-3" *ngIf="role == 'ServiceCenter'">
                    <label class="form-label">Center Name</label>
                    <input type="text" class="form-control" formControlName="centerName">
                    <div class="text-danger" *ngIf="form.get('centerName')?.touched && form.get('centerName')?.invalid">
                        Center Name is required.
                    </div>
                </div>

                <!-- Email & Phone -->
                <div class="row mb-3">
                    <div class="col-lg-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" formControlName="email">
                        <div class="text-danger" *ngIf="form.get('email')?.touched">
                            <div *ngIf="form.get('email')?.errors?.['required']">Email is required.</div>
                            <div *ngIf="form.get('email')?.errors?.['email']">Invalid email format.</div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" formControlName="phone">
                        <div class="text-danger" *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">
                            Phone is required.
                        </div>
                    </div>
                </div>

                <!-- Username & Password -->
                <div class="row mb-3">
                    <div class="col-lg-6">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" formControlName="userName">
                        <div class="text-danger" *ngIf="form.get('userName')?.touched && form.get('userName')?.invalid">
                            Username is required.
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" formControlName="password">
                        <div class="text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
                            Password is required.
                        </div>
                    </div>
                </div>

                <!-- Conditional Address -->
                <div class="row mb-3" *ngIf="role === 'ServiceCenter'">
                    <div class="col-lg-6">
                        <label class="form-label">AddressLane 1</label>
                        <input type="text" class="form-control" formControlName="addressLane1">
                    </div>
                    <div class="col-lg-6">
                        <label class="form-label">AddressLane 2</label>
                        <input type="text" class="form-control" formControlName="addressLane2">
                    </div>
                </div>

                <!-- Location -->
                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <select class="form-select" formControlName="locationId">
                        <option value="">Select Location</option>
                        <option *ngFor="let item of location" [value]="item.locationId">
                            {{ item.locationName }}
                        </option>
                    </select>
                    <div class="text-danger" *ngIf="form.get('locationId')?.touched && form.get('locationId')?.invalid">
                        Location is required.
                    </div>
                </div>

                <div class="mb-3" *ngIf="role == 'ServiceCenter'">
                    <label class="form-label">Service Category</label>
                    <select class="form-select" formControlName="serviceCategoryId">
                        <option value="">Select Category</option>
                        <option value="{{ item.id }}" *ngFor="let item of serviceCategory">{{ item.name }}</option>
                    </select>
                    <div class="text-danger" *ngIf="form.get('serviceCategoryId')?.touched && form.get('serviceCategoryId')?.invalid">
                        Service Category is required.
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="d-flex justify-content-center mb-3">
                    <button class="btn btn-warning px-5">Signup</button>
                </div>
            </form>

            <div class="mt-2">
                <p>Can't find your location? <span class="fw-bold text-primary" (click)="openModal()">Add
                        Location</span></p>
                <app-location [show]="showModal" (close)="handleCloseModal()"></app-location>
            </div>
        </div>
    </div>
</div>
