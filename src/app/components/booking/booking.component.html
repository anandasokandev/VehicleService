<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <div class="booking-calendar container p-3" role="application" aria-label="Booking calendar">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button
        aria-label="Previous month"
        class="btn btn-outline-primary"
        (click)="prevMonth()"
      >
        <span class="material-icons">chevron_left</span>
      </button>
      <h2 class="m-0" id="calendar-label">{{ months[currentMonth] }} {{ currentYear }}</h2>
      <button
        aria-label="Next month"
        class="btn btn-outline-primary"
        (click)="nextMonth()"
      >
        <span class="material-icons">chevron_right</span>
      </button>
    </div>
    <div class="d-flex justify-content-between calendar-weekdays text-center fw-bold border-bottom pb-2">
      <div class="flex-fill">Sun</div>
      <div class="flex-fill">Mon</div>
      <div class="flex-fill">Tue</div>
      <div class="flex-fill">Wed</div>
      <div class="flex-fill">Thu</div>
      <div class="flex-fill">Fri</div>
      <div class="flex-fill">Sat</div>
    </div>
    <div class="calendar-days d-grid" [ngStyle]="{'grid-template-columns': 'repeat(7, 1fr)', 'gap': '8px', 'margin-top': '12px'}" role="grid" aria-labelledby="calendar-label">
      <button
        *ngFor="let day of calendarDays; let i = index"
        class="btn p-2 rounded text-center day-button"
        [class.disabled]="day === null"
        [class.today]="isToday(day)"
        [class.selected]="isSelected(day)"
        [class.booked]="isBooked(day)"
        [attr.aria-selected]="isSelected(day)"
        [attr.tabindex]="day !== null ? 0 : -1"
        (click)="day !== null && selectDate(day)"
        [disabled]="day === null"
        role="gridcell"
        type="button"
        [attr.aria-label]="day ? getAriaLabel(day) : ''"
      >
        {{ day }}
      </button>
    </div>
    <div class="mt-3" *ngIf="selectedDate">
      <div class="alert alert-info d-flex align-items-center" role="alert">
        <span class="material-icons me-2" aria-hidden="true">event_available</span>
        Selected booking date: <strong class="ms-1">{{ selectedDate }}</strong>
      </div>
      <button class="btn btn-success" (click)="confirmBooking()" [disabled]="isBooked(selectedDate.getDate())">
        <span class="material-icons me-1">check_circle</span> Confirm Booking
      </button>
    </div>
    <div class="mt-3" *ngIf="bookingConfirmed">
      <div class="alert alert-success d-flex align-items-center" role="alert">
        <span class="material-icons me-2" aria-hidden="true">check_circle_outline</span>
        Booking confirmed for <strong>{{ selectedDate }}</strong>.
      </div>
    </div>
  </div>
