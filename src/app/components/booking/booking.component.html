<!-- Link Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

<div class="row mt-5">
  <!-- Vehicle and Service Center Selection -->
  <div class="col-lg-6">
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-warning text-black p-3">
        Select Vehicle and Service Center
      </div>
      <div class="card-body">
        <form>
          <div class="mb-3">
            <label for="vehicleSelect" class="form-label">Select Vehicle</label>
            <select id="vehicleSelect" class="form-select" [(ngModel)]="selectedVehicle" name="vehicle">
              <option *ngFor="let vehicle of vehicles" [value]="vehicle">{{ vehicle }}</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="centerSelect" class="form-label">Select Service Center</label>
            <select id="centerSelect" class="form-select" [(ngModel)]="selectedCenter" name="center">
              <option *ngFor="let center of serviceCenters" [value]="center">{{ center }}</option>
            </select>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Calendar UI -->
  <div class="col-lg-6">
    <div class="booking-calendar container p-3 shadow-sm" role="application" aria-label="Booking calendar">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-outline-primary" (click)="prevMonth()">
          <span class="material-icons">chevron_left</span>
        </button>
        <h2 class="m-0" id="calendar-label">{{ months[currentMonth] }} {{ currentYear }}</h2>
        <button class="btn btn-outline-primary" (click)="nextMonth()">
          <span class="material-icons">chevron_right</span>
        </button>
      </div>

      <div class="d-flex justify-content-between calendar-weekdays text-center fw-bold border-bottom pb-2">
        <div class="flex-fill">Sun</div><div class="flex-fill">Mon</div><div class="flex-fill">Tue</div>
        <div class="flex-fill">Wed</div><div class="flex-fill">Thu</div><div class="flex-fill">Fri</div><div class="flex-fill">Sat</div>
      </div>

      <div class="calendar-days d-grid" [ngStyle]="{ 'grid-template-columns': 'repeat(7, 1fr)', 'gap': '8px', 'margin-top': '12px' }">
        <button *ngFor="let day of calendarDays"
          class="btn p-2 rounded text-center day-button"
          [class.disabled]="day === null"
          [class.today]="isToday(day)"
          [class.selected]="isSelected(day)"
          [class.booked]="isBooked(day)"
          [attr.aria-selected]="isSelected(day)"
          [attr.tabindex]="day !== null ? 0 : -1"
          (click)="day !== null && selectDate(day)"
          [disabled]="day === null"
          [attr.aria-label]="day ? getAriaLabel(day) : ''"
        >
          {{ day }}
        </button>
      </div>

      <div class="mt-3" *ngIf="selectedDate">
        <div class="alert alert-info d-flex align-items-center" role="alert">
          <span class="material-icons me-2">event_available</span>
          Selected booking date: <strong class="ms-1">{{ selectedDate | date: 'longDate' }}</strong>
        </div>
        <button class="btn btn-success" (click)="confirmBooking()" [disabled]="isBooked(selectedDate)">
          <span class="material-icons me-1">check_circle</span> Confirm Booking
        </button>
      </div>

      <div class="mt-3" *ngIf="bookingConfirmed">
        <div class="alert alert-success d-flex align-items-center" role="alert">
          <span class="material-icons me-2">check_circle_outline</span>
          Booking confirmed for <strong>{{ selectedDate | date: 'longDate' }}</strong>.
        </div>
      </div>
    </div>
  </div>
</div>
