  <div class="row mb-3 mt-4">
    <div class="col-12 text-center">
        <div class="btn-group" role="group" aria-label="Booking Status">
            <button class="btn btn-outline-danger" [class.active]="status == 'Cancelled'" (click)="bookingStatus('Cancelled')">Cancelled</button>
            <button class="btn btn-outline-warning" [class.active]="status == 'Completed'" (click)="bookingStatus('Completed')">Completed</button>
        </div>
    </div>
</div>
<div class="row">
    <app-upcomming-booking [bookingStatus]="status"></app-upcomming-booking>
</div>
