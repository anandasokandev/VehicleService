<div class="card shadow-sm mt-3 mb-4">
    <div class="card-header bg-info text-white text-center">
        <h5 class="mb-0">My Vehicles</h5>
    </div>
    <div class="card-body">
        <!-- Two-Wheelers -->
          <h6 class="text-success mb-3">Two-Wheelers</h6>
       @for (item of vehicleDetails; track $index) 
       {
         <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <p><strong>Vehicle Number:</strong> {{ item.registrationNumber }} </p>
                <p><strong>Brand:</strong> {{ item.make }} </p>
                <p><strong>Model:</strong> {{ item.model }}</p>
                <p><strong>Year:</strong> {{ item.year }}</p>
            </div>
            <!-- <div class="col-md-4">
                <p><strong>Last Service:</strong> {{}}</p>
                <p><strong>Status:</strong> Completed</p>
            </div> -->
            <div class="col-md-6 text-end">
                <button class="btn btn-sm btn-outline-primary me-1">
                    ✏️ Edit
                </button>
                <button class="btn btn-sm btn-outline-danger">
                    🗑️ Delete
                </button>
            </div>
        </div>
       }
    </div>
</div>
